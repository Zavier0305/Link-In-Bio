<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zavier | Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #ffffff;
            color: #1a1f23;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .link-card {
            border: 1px solid #e1e4e8;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .link-card:hover {
            background-color: #f6f8fa;
            border-color: #2ea44f;
            transform: translateX(4px);
        }
        .icon-container {
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2ea44f;
            fill: currentColor;
        }
        .status-tag {
            background-color: #f0fff4;
            color: #22863a;
            border: 1px solid rgba(34, 134, 58, 0.2);
            font-size: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-16 pb-12 px-6">

    <div class="max-w-md w-full">
        <!-- Profile Section -->
        <div class="mb-12 text-left">
            <h1 class="text-2xl font-bold mb-1 tracking-tight">Zavier</h1>
            <p class="text-gray-500 text-sm mb-4">14y.o. Developer & Creator</p>
            
            <div class="flex flex-wrap gap-2">
                <span class="status-tag px-2 py-0.5 rounded">SYS_LOC: GUNMA</span>
                <span class="status-tag px-2 py-0.5 rounded">CORE_ID: 14-ZAV</span>
            </div>
        </div>

        <!-- Links Section -->
        <div class="space-y-3">
            <!-- GitHub -->
            <a href="https://github.com/Zavier0305" target="_blank" class="link-card flex items-center p-4 rounded-lg group">
                <div class="icon-container mr-4">
                    <i class="fab fa-github text-xl"></i>
                </div>
                <div class="flex-1">
                    <span class="font-medium">GitHub</span>
                </div>
                <i class="fas fa-arrow-right text-gray-200 text-xs group-hover:text-green-600 ml-2"></i>
            </a>

            <!-- X (Twitter) -->
            <a href="https://x.com/KantZav_" target="_blank" class="link-card flex items-center p-4 rounded-lg group">
                <div class="icon-container mr-4">
                    <svg viewBox="0 0 24 24" class="w-5 h-5">
                        <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932 6.064-6.932zm-1.292 19.494h2.039L6.486 3.24H4.298L17.61 20.647z"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <span class="font-medium">X (Twitter)</span>
                </div>
                <i class="fas fa-arrow-right text-gray-200 text-xs group-hover:text-green-600 ml-2"></i>
            </a>

            <!-- Zenn -->
            <a href="https://zenn.dev/zavier" target="_blank" class="link-card flex items-center p-4 rounded-lg group">
                <div class="icon-container mr-4">
                    <i class="fas fa-terminal text-lg"></i>
                </div>
                <div class="flex-1">
                    <span class="font-medium">Zenn</span>
                </div>
                <i class="fas fa-arrow-right text-gray-200 text-xs group-hover:text-green-600 ml-2"></i>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@ザビエル-zav" target="_blank" class="link-card flex items-center p-4 rounded-lg group">
                <div class="icon-container mr-4">
                    <i class="fab fa-youtube text-xl"></i>
                </div>
                <div class="flex-1">
                    <span class="font-medium">YouTube</span>
                </div>
                <i class="fas fa-arrow-right text-gray-200 text-xs group-hover:text-green-600 ml-2"></i>
            </a>
        </div>

        <!-- Minimal Footer -->
        <footer class="mt-20 border-t border-gray-100 pt-6 text-center">
            <p class="text-[10px] text-gray-400 font-mono tracking-widest uppercase">
                &copy; 2024 Zavier // build.stable.0305
            </p>
        </footer>
    </div>

</body>
</html>
