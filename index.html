<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Zavier | Links & Decks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: rgba(255, 255, 255, 0.045);
            --border: rgba(255, 255, 255, 0.12);
            --text-primary: #f2f2f2;
            --text-secondary: #a3a3a3;
            --text-muted: #6b6b6b;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .profile-avatar-ring {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #fff, #4a4a4a);
        }
        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--bg);
            object-fit: cover;
            display: block;
            filter: grayscale(1) contrast(1.05);
        }

        .platform-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
        }
        .platform-pill:hover {
            border-color: transparent;
            color: #000;
            background: #fff;
        }

        .gradient-text {
            background: linear-gradient(90deg, #fff 10%, #999 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .replay-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
        }
        .replay-btn:hover {
            border-color: transparent;
            color: #000;
            background: #fff;
        }

        /* --- Project cards: pack-pull flip reveal --- */
        .card-slot {
            display: block;
            position: relative;
            aspect-ratio: 3 / 4;
            perspective: 1200px;
        }

        .link-card {
            position: absolute;
            inset: 0;
            border-radius: 1.25rem;
            transform-style: preserve-3d;
            transform: rotateY(180deg);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.3s ease;
            animation: flip-reveal 0.8s cubic-bezier(0.3, 0.2, 0.2, 1) forwards;
            animation-delay: calc(var(--i, 0) * 180ms + 250ms);
        }
        .link-card.settled:hover {
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
        }

        @keyframes flip-reveal {
            0%   { transform: rotateY(180deg) scale(0.9); }
            60%  { transform: rotateY(0deg) scale(1.04); }
            100% { transform: rotateY(0deg) scale(1); }
        }

        .card-face {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            backface-visibility: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* face-down side: card back design */
        .card-back-face {
            transform: rotateY(180deg);
            background: linear-gradient(155deg, #1d1d1d, #050505);
            align-items: center;
            justify-content: center;
        }
        .card-back-face::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 11px);
        }
        .card-back-face::after {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 1rem;
            pointer-events: none;
        }
        .card-back-emblem {
            position: relative;
            z-index: 1;
            width: 25%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: #eee;
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.12);
        }

        /* face-up side: actual project content */
        .card-front-face {
            background: linear-gradient(165deg, #202020, #060606);
        }

        /* idle diagonal foil shimmer (front face only, once revealed) */
        .link-card.settled .card-front-face::before {
            content: '';
            position: absolute;
            inset: -60%;
            background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.10) 50%, transparent 60%);
            animation: shimmer 6s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes shimmer {
            0%   { transform: translate(-20%, -15%); }
            100% { transform: translate(20%, 15%); }
        }

        /* cursor-tracking holo sheen */
        .card-front-face::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.28), transparent 45%);
            mix-blend-mode: overlay;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 2;
        }
        .link-card.settled:hover .card-front-face::after { opacity: 1; }

        /* reveal flash burst, sits above the flipping card */
        .card-flash {
            position: absolute;
            inset: -12%;
            border-radius: 1.25rem;
            background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            animation: flash-burst 0.9s ease-out forwards;
            animation-delay: calc(var(--i, 0) * 180ms + 250ms);
        }
        @keyframes flash-burst {
            0%, 38% { opacity: 0; }
            52%     { opacity: 0.85; }
            72%, 100% { opacity: 0; }
        }

        .project-preview {
            width: 100%;
            height: 55%;
            flex-shrink: 0;
            background: #111;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.05);
        }

        .card-body {
            position: relative;
            z-index: 3;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
        }

        .card-desc {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tech-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-12 pb-16">
    <div class="w-full max-w-3xl px-6">
        <!-- Profile -->
        <div class="mb-12 flex flex-col items-center text-center">
            <div class="profile-avatar-ring mb-5">
                <img src="https://github.com/Zavier0305.png" alt="Zavier" class="profile-avatar">
            </div>
            <h1 class="text-3xl font-black tracking-tight gradient-text mb-1">Zavier</h1>
            <p class="text-[var(--text-secondary)] text-sm font-medium mb-3">Fullstack Explorer & Creative Coder</p>
            <span class="text-[11px] text-[var(--text-muted)]"><i class="fas fa-map-marker-alt mr-1"></i>Gunma, JP</span>
        </div>

        <!-- Social links -->
        <div class="mb-14 flex flex-wrap justify-center gap-3">
            <a href="https://github.com/Zavier0305" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="https://x.com/KantZav" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932 6.064-6.932zm-1.292 19.494h2.039L6.486 3.24H4.298L17.61 20.647z"></path></svg>
                Twitter
            </a>
            <a href="https://zenn.dev/zavier" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fas fa-pen-nib"></i> Zenn
            </a>
            <a href="https://www.youtube.com/@ザビエル-zav" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fab fa-youtube"></i> Studio
            </a>
        </div>

        <!-- Projects -->
        <div>
            <div class="flex items-center justify-center gap-3 mb-5">
                <p class="text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-[0.3em]">Projects</p>
            </div>
            <div id="projects-container" class="grid grid-cols-2 gap-4 sm:gap-5"></div>
            <div class="mt-6 flex justify-center">
                <button id="replay-btn" class="replay-btn flex items-center gap-2 px-5 py-2 rounded-xl text-xs font-bold">
                    <i class="fas fa-layer-group"></i> もう一度開封する
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-16 pt-8 border-t border-[var(--border)] text-center">
            <p class="text-[11px] text-[var(--text-muted)]">Design & Engineering by Zavier</p>
        </footer>
    </div>

    <script>
        const projects = [
            {
                title: "将棋アプリ",
                desc: "本格的な将棋対局をWebで。Firebaseを活用したリアルタイム通信による対戦体験。",
                tech: "React / Firebase",
                url: "https://shogi-app-pearl.vercel.app/",
                repo: "shogi-app"
            },
            {
                title: "HowToGetPassport",
                desc: "パスポートの申請方法をわかりやすく解説。旅の第一歩をサポートするガイドサイト。",
                tech: "Guide / Web",
                url: "https://zavier0305.github.io/HowToGetPassport/",
                repo: "HowToGetPassport"
            },
            {
                title: "SmartFlow",
                desc: "直感的な操作で思考を可視化するフローチャートエンジン。SVGの極致。",
                tech: "SVG / JS",
                url: "https://zavier0305.github.io/SmartFlow/",
                repo: "SmartFlow"
            },
            {
                title: "THE BUTTER",
                desc: "塗り残しゼロを目指す。バター本来の質感にこだわったシミュレーター。",
                tech: "Canvas / Physics",
                url: "https://zavier0305.github.io/THE-BUTTER/",
                repo: "THE-BUTTER"
            },
            {
                title: "Reverse Pomodoro",
                desc: "25分の休憩と5分の作業。究極の休息を求めるあなたに贈るタイマー。",
                tech: "Vanilla JS",
                url: "https://zavier0305.github.io/ReversePomodoroTimer/",
                repo: "ReversePomodoroTimer"
            },
            {
                title: "GOKIBURYYYYY",
                desc: "視界を埋め尽くす黒い影。あなたのクリック精度が試されるサバイバル。",
                tech: "Game Engine",
                url: "https://zavier0305.github.io/GOKIBURYYYYY/",
                repo: "GOKIBURYYYYY"
            },
            {
                title: "反射神経",
                desc: "瞬間の判断力を鍛える反射神経テスト。自分の限界に挑戦しよう。",
                tech: "Vanilla JS",
                url: "https://zavier0305.github.io/hanshasinkei/",
                repo: "hanshasinkei"
            }
        ];

        // 画像は screenshot.png -> icon.png -> プレースホルダーの順でフォールバック
        function rawUrl(repo, file) {
            return `https://github.com/Zavier0305/${repo}/blob/main/${file}?raw=true`;
        }

        const container = document.getElementById('projects-container');

        projects.forEach((p, i) => {
            const slot = document.createElement('a');
            slot.href = p.url;
            slot.target = '_blank';
            slot.className = 'card-slot';
            slot.style.setProperty('--i', i);
            slot.innerHTML = `
                <div class="link-card">
                    <div class="card-face card-back-face">
                        <div class="card-back-emblem">Z</div>
                    </div>
                    <div class="card-face card-front-face">
                        <div class="project-preview">
                            <img alt="${p.title}" class="project-image">
                        </div>
                        <div class="card-body p-4">
                            <div>
                                <h3 class="font-black text-base text-white mb-1">${p.title}</h3>
                                <p class="card-desc text-[10px] text-[var(--text-secondary)] leading-relaxed font-medium">
                                    ${p.desc}
                                </p>
                            </div>
                            <div class="mt-2 flex items-center justify-between">
                                <span class="tech-badge">${p.tech}</span>
                                <i class="fas fa-arrow-up-right-from-square text-[var(--text-muted)] text-xs"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-flash"></div>
            `;

            const img = slot.querySelector('.project-image');
            img.src = rawUrl(p.repo, 'screenshot.png');
            img.addEventListener('error', function handleError() {
                if (this.dataset.stage !== 'icon') {
                    this.dataset.stage = 'icon';
                    this.src = rawUrl(p.repo, 'icon.png');
                } else {
                    this.removeEventListener('error', handleError);
                    this.src = `https://via.placeholder.com/300x188?text=${encodeURIComponent(p.title)}`;
                }
            });

            const card = slot.querySelector('.link-card');

            // 開封アニメーションが終わったらチルト操作を有効化
            card.addEventListener('animationend', function onEnd(e) {
                if (e.animationName !== 'flip-reveal') return;
                card.classList.add('settled');
                card.style.transform = '';
            });

            // ポケポケ風パック開封: 開封後はマウス位置に応じた3Dチルト+ホロ光沢
            slot.addEventListener('mousemove', (e) => {
                if (!card.classList.contains('settled')) return;
                const rect = slot.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                const rotateX = (0.5 - y) * 16;
                const rotateY = (x - 0.5) * 16;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.04)`;
                card.style.setProperty('--mx', `${x * 100}%`);
                card.style.setProperty('--my', `${y * 100}%`);
            });
            slot.addEventListener('mouseleave', () => {
                if (!card.classList.contains('settled')) return;
                card.style.transform = 'rotateX(0) rotateY(0) scale(1)';
            });

            container.appendChild(slot);
        });

        function playReveal() {
            container.querySelectorAll('.link-card').forEach((card) => {
                card.classList.remove('settled');
                card.style.transform = '';
                card.style.animation = 'none';
                void card.offsetWidth; // reflow to restart animation
                card.style.animation = '';
            });
            container.querySelectorAll('.card-flash').forEach((flash) => {
                flash.style.animation = 'none';
                void flash.offsetWidth;
                flash.style.animation = '';
            });
        }
        document.getElementById('replay-btn').addEventListener('click', playReveal);
    </script>
</body>
</html>
