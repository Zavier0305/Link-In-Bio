<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0c12">
    <title>Zavier | Links & Decks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0c12;
            --surface: rgba(255, 255, 255, 0.045);
            --border: rgba(255, 255, 255, 0.09);
            --text-primary: #f4f5f9;
            --text-secondary: #9aa2b1;
            --text-muted: #5f6675;
            --accent-a: #8b5cf6;
            --accent-b: #06b6d4;
        }

        * { box-sizing: border-box; }

        body {
            background:
                radial-gradient(60vw 60vw at 10% -10%, rgba(139, 92, 246, 0.16), transparent 60%),
                radial-gradient(50vw 50vw at 100% 10%, rgba(6, 182, 212, 0.12), transparent 60%),
                var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .profile-avatar-ring {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        }
        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--bg);
            object-fit: cover;
            display: block;
        }

        .glass {
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .platform-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
        }
        .platform-pill:hover {
            border-color: transparent;
            color: #fff;
            background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
        }

        .gradient-text {
            background: linear-gradient(90deg, #fff 10%, #c4b5fd 70%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* --- Project cards --- */
        .link-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .link-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-3px);
        }

        .project-preview {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #10131c;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }
        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tech-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border: 1px solid transparent;
        }

        .badge-blue    { background: rgba(59,130,246,0.14);  color: #7dabff; border-color: rgba(59,130,246,0.3); }
        .badge-yellow  { background: rgba(234,179,8,0.14);   color: #ffd657; border-color: rgba(234,179,8,0.3); }
        .badge-orange  { background: rgba(249,115,22,0.14);  color: #ff9f5a; border-color: rgba(249,115,22,0.3); }
        .badge-red     { background: rgba(239,68,68,0.14);   color: #ff8080; border-color: rgba(239,68,68,0.3); }
        .badge-indigo  { background: rgba(129,140,248,0.14); color: #a5b4fc; border-color: rgba(129,140,248,0.3); }
        .badge-emerald { background: rgba(16,185,129,0.14);  color: #6ee7b7; border-color: rgba(16,185,129,0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-12 pb-16">
    <div class="w-full max-w-3xl px-6">
        <!-- Profile -->
        <div class="mb-12 flex flex-col items-center text-center">
            <div class="profile-avatar-ring mb-5">
                <img src="https://github.com/Zavier0305.png" alt="Zavier" class="profile-avatar">
            </div>
            <h1 class="text-3xl font-black tracking-tight gradient-text mb-1">Zavier</h1>
            <p class="text-[var(--text-secondary)] text-sm font-medium mb-3">Fullstack Explorer & Creative Coder</p>
            <span class="text-[11px] text-[var(--text-muted)]"><i class="fas fa-map-marker-alt mr-1"></i>Gunma, JP</span>
        </div>

        <!-- Social links -->
        <div class="mb-14 flex flex-wrap justify-center gap-3">
            <a href="https://github.com/Zavier0305" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="https://x.com/KantZav" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932 6.064-6.932zm-1.292 19.494h2.039L6.486 3.24H4.298L17.61 20.647z"></path></svg>
                Twitter
            </a>
            <a href="https://zenn.dev/zavier" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fas fa-pen-nib"></i> Zenn
            </a>
            <a href="https://www.youtube.com/@ザビエル-zav" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fab fa-youtube"></i> Studio
            </a>
        </div>

        <!-- Projects -->
        <div>
            <p class="text-center text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-[0.3em] mb-5">Projects</p>
            <div id="projects-container" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
        </div>

        <!-- Footer -->
        <footer class="mt-16 pt-8 border-t border-[var(--border)] text-center">
            <p class="text-[11px] text-[var(--text-muted)]">Design & Engineering by Zavier</p>
        </footer>
    </div>

    <script>
        const projects = [
            {
                title: "将棋アプリ",
                desc: "本格的な将棋対局をWebで。Firebaseを活用したリアルタイム通信による対戦体験。",
                tech: "React / Firebase",
                color: "emerald",
                url: "https://shogi-app-pearl.vercel.app/",
                repo: "shogi-app"
            },
            {
                title: "HowToGetPassport",
                desc: "パスポートの申請方法をわかりやすく解説。旅の第一歩をサポートするガイドサイト。",
                tech: "Guide / Web",
                color: "indigo",
                url: "https://zavier0305.github.io/HowToGetPassport/",
                repo: "HowToGetPassport"
            },
            {
                title: "SmartFlow",
                desc: "直感的な操作で思考を可視化するフローチャートエンジン。SVGの極致。",
                tech: "SVG / JS",
                color: "blue",
                url: "https://zavier0305.github.io/SmartFlow/",
                repo: "SmartFlow"
            },
            {
                title: "THE BUTTER",
                desc: "塗り残しゼロを目指す。バター本来の質感にこだわったシミュレーター。",
                tech: "Canvas / Physics",
                color: "yellow",
                url: "https://zavier0305.github.io/THE-BUTTER/",
                repo: "THE-BUTTER"
            },
            {
                title: "Reverse Pomodoro",
                desc: "25分の休憩と5分の作業。究極の休息を求めるあなたに贈るタイマー。",
                tech: "Vanilla JS",
                color: "orange",
                url: "https://zavier0305.github.io/ReversePomodoroTimer/",
                repo: "ReversePomodoroTimer"
            },
            {
                title: "GOKIBURYYYYY",
                desc: "視界を埋め尽くす黒い影。あなたのクリック精度が試されるサバイバル。",
                tech: "Game Engine",
                color: "red",
                url: "https://zavier0305.github.io/GOKIBURYYYYY/",
                repo: "GOKIBURYYYYY"
            },
            {
                title: "反射神経",
                desc: "瞬間の判断力を鍛える反射神経テスト。自分の限界に挑戦しよう。",
                tech: "Vanilla JS",
                color: "blue",
                url: "https://zavier0305.github.io/hanshasinkei/",
                repo: "hanshasinkei"
            }
        ];

        // 画像は screenshot.png -> icon.png -> プレースホルダーの順でフォールバック
        function rawUrl(repo, file) {
            return `https://github.com/Zavier0305/${repo}/blob/main/${file}?raw=true`;
        }

        const container = document.getElementById('projects-container');

        projects.forEach(p => {
            const card = document.createElement('a');
            card.href = p.url;
            card.target = '_blank';
            card.className = 'link-card';
            card.innerHTML = `
                <div class="project-preview">
                    <img alt="${p.title}" class="project-image">
                </div>
                <div class="p-5 flex-1 flex flex-col justify-between">
                    <div>
                        <h3 class="font-black text-lg text-white mb-1.5">${p.title}</h3>
                        <p class="text-[11px] text-[var(--text-secondary)] leading-relaxed font-medium">
                            ${p.desc}
                        </p>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="tech-badge badge-${p.color}">${p.tech}</span>
                        <i class="fas fa-arrow-up-right-from-square text-[var(--text-muted)] text-xs"></i>
                    </div>
                </div>
            `;

            const img = card.querySelector('.project-image');
            img.src = rawUrl(p.repo, 'screenshot.png');
            img.addEventListener('error', function handleError() {
                if (this.dataset.stage !== 'icon') {
                    this.dataset.stage = 'icon';
                    this.src = rawUrl(p.repo, 'icon.png');
                } else {
                    this.removeEventListener('error', handleError);
                    this.src = `https://via.placeholder.com/300x188?text=${encodeURIComponent(p.title)}`;
                }
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
