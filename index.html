<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Zavier | Links & Decks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: rgba(255, 255, 255, 0.045);
            --border: rgba(255, 255, 255, 0.12);
            --text-primary: #f2f2f2;
            --text-secondary: #a3a3a3;
            --text-muted: #6b6b6b;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .profile-avatar-ring {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #fff, #4a4a4a);
        }
        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--bg);
            object-fit: cover;
            display: block;
            filter: grayscale(1) contrast(1.05);
        }

        .platform-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
        }
        .platform-pill:hover {
            border-color: transparent;
            color: #000;
            background: #fff;
        }

        .gradient-text {
            background: linear-gradient(90deg, #fff 10%, #999 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* --- Project cards: foil "pack pull" style --- */
        .card-grid {
            perspective: 1200px;
        }

        .link-card {
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 1.25rem;
            overflow: hidden;
            background: linear-gradient(165deg, #202020, #060606);
            border: 1px solid var(--border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transition: transform 0.12s ease-out, box-shadow 0.3s ease, border-color 0.3s ease;
            opacity: 0;
            animation: pull-reveal 0.7s cubic-bezier(0.2, 0.85, 0.3, 1) forwards;
            animation-delay: calc(var(--i, 0) * 90ms);
            will-change: transform;
        }
        .link-card:hover {
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
        }

        @keyframes pull-reveal {
            0%   { opacity: 0; transform: translateY(30px) rotateX(-12deg) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        }

        /* idle diagonal foil shimmer */
        .link-card::before {
            content: '';
            position: absolute;
            inset: -60%;
            background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.10) 50%, transparent 60%);
            animation: shimmer 6s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes shimmer {
            0%   { transform: translate(-20%, -15%); }
            100% { transform: translate(20%, 15%); }
        }

        /* cursor-tracking holo sheen */
        .link-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(480px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.28), transparent 45%);
            mix-blend-mode: overlay;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 2;
        }
        .link-card:hover::after { opacity: 1; }

        .project-preview {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #111;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.05);
        }

        .card-body { position: relative; z-index: 2; }

        .tech-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-12 pb-16">
    <div class="w-full max-w-3xl px-6">
        <!-- Profile -->
        <div class="mb-12 flex flex-col items-center text-center">
            <div class="profile-avatar-ring mb-5">
                <img src="https://github.com/Zavier0305.png" alt="Zavier" class="profile-avatar">
            </div>
            <h1 class="text-3xl font-black tracking-tight gradient-text mb-1">Zavier</h1>
            <p class="text-[var(--text-secondary)] text-sm font-medium mb-3">Fullstack Explorer & Creative Coder</p>
            <span class="text-[11px] text-[var(--text-muted)]"><i class="fas fa-map-marker-alt mr-1"></i>Gunma, JP</span>
        </div>

        <!-- Social links -->
        <div class="mb-14 flex flex-wrap justify-center gap-3">
            <a href="https://github.com/Zavier0305" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="https://x.com/KantZav" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932 6.064-6.932zm-1.292 19.494h2.039L6.486 3.24H4.298L17.61 20.647z"></path></svg>
                Twitter
            </a>
            <a href="https://zenn.dev/zavier" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fas fa-pen-nib"></i> Zenn
            </a>
            <a href="https://www.youtube.com/@ザビエル-zav" target="_blank" class="platform-pill flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold">
                <i class="fab fa-youtube"></i> Studio
            </a>
        </div>

        <!-- Projects -->
        <div>
            <p class="text-center text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-[0.3em] mb-5">Projects</p>
            <div id="projects-container" class="card-grid grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
        </div>

        <!-- Footer -->
        <footer class="mt-16 pt-8 border-t border-[var(--border)] text-center">
            <p class="text-[11px] text-[var(--text-muted)]">Design & Engineering by Zavier</p>
        </footer>
    </div>

    <script>
        const projects = [
            {
                title: "将棋アプリ",
                desc: "本格的な将棋対局をWebで。Firebaseを活用したリアルタイム通信による対戦体験。",
                tech: "React / Firebase",
                url: "https://shogi-app-pearl.vercel.app/",
                repo: "shogi-app"
            },
            {
                title: "HowToGetPassport",
                desc: "パスポートの申請方法をわかりやすく解説。旅の第一歩をサポートするガイドサイト。",
                tech: "Guide / Web",
                url: "https://zavier0305.github.io/HowToGetPassport/",
                repo: "HowToGetPassport"
            },
            {
                title: "SmartFlow",
                desc: "直感的な操作で思考を可視化するフローチャートエンジン。SVGの極致。",
                tech: "SVG / JS",
                url: "https://zavier0305.github.io/SmartFlow/",
                repo: "SmartFlow"
            },
            {
                title: "THE BUTTER",
                desc: "塗り残しゼロを目指す。バター本来の質感にこだわったシミュレーター。",
                tech: "Canvas / Physics",
                url: "https://zavier0305.github.io/THE-BUTTER/",
                repo: "THE-BUTTER"
            },
            {
                title: "Reverse Pomodoro",
                desc: "25分の休憩と5分の作業。究極の休息を求めるあなたに贈るタイマー。",
                tech: "Vanilla JS",
                url: "https://zavier0305.github.io/ReversePomodoroTimer/",
                repo: "ReversePomodoroTimer"
            },
            {
                title: "GOKIBURYYYYY",
                desc: "視界を埋め尽くす黒い影。あなたのクリック精度が試されるサバイバル。",
                tech: "Game Engine",
                url: "https://zavier0305.github.io/GOKIBURYYYYY/",
                repo: "GOKIBURYYYYY"
            },
            {
                title: "反射神経",
                desc: "瞬間の判断力を鍛える反射神経テスト。自分の限界に挑戦しよう。",
                tech: "Vanilla JS",
                url: "https://zavier0305.github.io/hanshasinkei/",
                repo: "hanshasinkei"
            }
        ];

        // 画像は screenshot.png -> icon.png -> プレースホルダーの順でフォールバック
        function rawUrl(repo, file) {
            return `https://github.com/Zavier0305/${repo}/blob/main/${file}?raw=true`;
        }

        const container = document.getElementById('projects-container');

        projects.forEach((p, i) => {
            const card = document.createElement('a');
            card.href = p.url;
            card.target = '_blank';
            card.className = 'link-card';
            card.style.setProperty('--i', i);
            card.innerHTML = `
                <div class="project-preview">
                    <img alt="${p.title}" class="project-image">
                </div>
                <div class="card-body p-5 flex-1 flex flex-col justify-between">
                    <div>
                        <h3 class="font-black text-lg text-white mb-1.5">${p.title}</h3>
                        <p class="text-[11px] text-[var(--text-secondary)] leading-relaxed font-medium">
                            ${p.desc}
                        </p>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="tech-badge">${p.tech}</span>
                        <i class="fas fa-arrow-up-right-from-square text-[var(--text-muted)] text-xs"></i>
                    </div>
                </div>
            `;

            const img = card.querySelector('.project-image');
            img.src = rawUrl(p.repo, 'screenshot.png');
            img.addEventListener('error', function handleError() {
                if (this.dataset.stage !== 'icon') {
                    this.dataset.stage = 'icon';
                    this.src = rawUrl(p.repo, 'icon.png');
                } else {
                    this.removeEventListener('error', handleError);
                    this.src = `https://via.placeholder.com/300x188?text=${encodeURIComponent(p.title)}`;
                }
            });

            // ポケポケ風パック開封: マウス位置に応じた3Dチルト+ホロ光沢
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                const rotateX = (0.5 - y) * 14;
                const rotateY = (x - 0.5) * 14;
                card.style.transform = `perspective(700px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
                card.style.setProperty('--mx', `${x * 100}%`);
                card.style.setProperty('--my', `${y * 100}%`);
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = '';
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
